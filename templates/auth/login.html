{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block auth_content %}
<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand school-brand" style="margin-bottom:18px;">
      {% include "partials/brand_header.html" %}
    </div>
    <h1 class="auth-title">Sign in</h1>
    <p class="auth-subtitle">{{ school_settings.motto if school_settings and school_settings.motto else 'School attendance system' }}</p>
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
    </form>
  </div>
</div>
{% endblock %}
